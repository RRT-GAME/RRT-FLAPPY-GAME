<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<script async src="https://plausible.io/js/pa-YcxLj2_9XuLoiVWJazzgA.js"></script>
<script>window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};plausible.init()</script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#000;overflow:hidden;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;}
canvas{display:block;width:100%;height:auto;max-height:100vh;max-width:calc(100vh * 400 / 600);}
#ui{position:absolute;width:100%;max-width:calc(100vh * 400 / 600);height:100vh;top:0;left:50%;transform:translateX(-50%);text-align:center;z-index:5;pointer-events:none;}
#menu,#dead{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88%;max-width:280px;pointer-events:auto;color:white;text-shadow:2px 2px 4px #000;display:none;flex-direction:column;align-items:center;gap:12px;padding:0;box-sizing:border-box;z-index:6;}
#menu h2,#dead h3{margin:0 0 8px 0;}
#menu p{margin:4px 0;font-size:16px;}
.panel{position:absolute;width:100%;max-width:500px;height:100vh;top:0;left:50%;transform:translateX(-50%) scale(0.9);background:#111;color:white;display:none;overflow-y:auto;z-index:10;opacity:0;transition:0.2s;pointer-events:auto;}
.panel.show{opacity:1;transform:translateX(-50%) scale(1);}
.tabs{display:flex;}
.tab{flex:1;padding:10px;background:#222;cursor:pointer;text-align:center;}
.tab.active{background:orange;}
.shopItem{background:#222;margin:10px;padding:10px;border-radius:10px;}
.preview{width:100px;height:50px;background:#000;margin:auto;}
button{pointer-events:auto;width:100%;padding:16px 24px;margin:0;font-size:20px;cursor:pointer;border:none;border-radius:14px;background:#ff9500;color:white;font-weight:bold;min-height:54px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 0 #cc7700;transition:transform.05s;}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #cc7700;}
button:disabled{background:#555;box-shadow:none;cursor:not-allowed;}
.shopItem button,#loginPanel button,#updates button,#leaderboardPanel button{width:auto;min-width:140px;padding:12px 20px;font-size:18px;min-height:46px;}
input{padding:12px;margin:8px;width:80%;border-radius:6px;border:none;font-size:16px;background:#222;color:white;}
</style>
</head>

<body>
<div id="ui">
<div id="menu" style="display:none">
<h2>RRT-GAMES</h2>
<p id="welcomeUser"></p>
<p>Coins: <span id="coinsUI">0</span></p>
<p>Best: <span id="bestUI">0</span></p>
<button onclick="startGame()">START</button>
<button onclick="openShop()">SHOP</button>
<button onclick="openLeaderboard()">LEADERBOARD</button>
<button onclick="openUpdates()">UPDATES</button>
<button onclick="logout()" style="background:#555;font-size:14px;min-height:40px;box-shadow:none">LOGOUT</button>
</div>
<div id="dead" style="display:none;">
<h3>GAME OVER</h3>
<button onclick="startGame()">RETRY</button>
<button onclick="backMenu()">MENU</button>
</div>
</div>

<div class="panel show" id="loginPanel" style="display:block;opacity:1;transform:translateX(-50%) scale(1);">
<h2 style="padding-top:10vh">RRT LOGIN</h2>
<div class="tabs">
<div class="tab active" id="tabLogin" onclick="switchAuth('login')">LOGIN</div>
<div class="tab" id="tabSignup" onclick="switchAuth('signup')">REGISTRIEREN</div>
</div>
<div id="loginForm" style="padding:20px">
<input id="loginEmail" type="email" placeholder="Email"><br>
<input id="loginPass" type="password" placeholder="Passwort"><br>
<button onclick="doLogin()">EINLOGGEN</button>
<p id="loginError" style="color:#ff5555"></p>
</div>
<div id="signupForm" style="padding:20px;display:none">
<input id="signupName" type="text" placeholder="Name"><br>
<input id="signupEmail" type="email" placeholder="Email"><br>
<input id="signupPass" type="password" placeholder="Passwort (min. 6)"><br>
<button onclick="doSignup()">ACCOUNT ERSTELLEN</button>
<p id="signupError" style="color:#ff5555"></p>
</div>
</div>

<div class="panel" id="shop">
<div class="tabs">
<div class="tab active" onclick="tab('skins')">SKINS</div>
<div class="tab" onclick="tab('upgrades')">UPGRADES</div>
</div>
<div id="skinsTab"></div>
<div id="upgradesTab" style="display:none;">
  <div class='shopItem'>🛡️ SHIELD<br>Price: 50<br>Survive 1x crash<br><button id="shieldBtn" onclick="buyShield()">BUY 50</button></div>
  <div class='shopItem'>💰💰 DOUBLE COINS<br>Price: 200<br>2x Coins for 1 round<br><button id="doubleCoinsBtn" onclick="buyDoubleCoins()">BUY 200</button></div>
</div>
<button onclick="closeShop()">BACK</button>
</div>

<div class="panel" id="leaderboardPanel">
<h2 style="padding-top:5vh">BESTENLISTE</h2>
<div id="leaderboardList" style="padding:20px"></div>
<button onclick="closeLeaderboard()">BACK</button>
</div>

<div class="panel" id="updates">
<h2>UPDATES</h2>
<div id="log"></div>
<button onclick="closeUpdates()">BACK</button>
</div>

<canvas id="game" width="400" height="600"></canvas>

<script>
const GAME_VERSION = "1.1.0";
const c=document.getElementById("game");
const ctx=c.getContext("2d");
const menu=document.getElementById("menu");
const dead=document.getElementById("dead");
const shop=document.getElementById("shop");
const updates=document.getElementById("updates");
const log=document.getElementById("log");
const coinsUI=document.getElementById("coinsUI");
const bestUI=document.getElementById("bestUI");
const skinsTab=document.getElementById("skinsTab");
let state="menu"; let bird,pipes=[]; let score=0,coins=0,best=0; let frame=0;
let hasShield=false; let shieldEquipped=false; let hasDoubleCoins=false; let doubleCoinsActive=false;

const firebaseConfig = {
    apiKey: "AIzaSyBBRFz8drGGRp_kpUR5HiIisR6WYdFnqI4",
    authDomain: "rrt-flappy-game.firebaseapp.com",
    databaseURL: "https://rrt-flappy-game-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "rrt-flappy-game",
    storageBucket: "rrt-flappy-game.firebasestorage.app",
    messagingSenderId: "376438140987",
    appId: "1:376438140987:web:15d964c26fa4a31ec4ec1e",
    measurementId: "G-9JLKEFHMPR"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(); const db=firebase.database(); let currentUser=null;

function saveGame(){
  const data={coins,best,skins,currentSkin,hasShield,shieldEquipped,hasDoubleCoins};
  localStorage.setItem("rrt_flappy_save",JSON.stringify(data));
  if(currentUser){
    db.ref('users/'+currentUser.uid).update({...data,name:currentUser.displayName||'Spieler',email:currentUser.email,best:best,updatedAt:Date.now()});
    db.ref('leaderboard/'+currentUser.uid).set({name:currentUser.displayName||'Spieler',best:best,updatedAt:Date.now()});
  }
}
function loadGame(){
  const data=JSON.parse(localStorage.getItem("rrt_flappy_save")); if(!data) return;
  coins=data.coins??0; best=data.best??0; currentSkin=data.currentSkin??"default";
  hasShield=data.hasShield??false; shieldEquipped=data.shieldEquipped??false; hasDoubleCoins=data.hasDoubleCoins??false;
  if(data.skins){for(let k in data.skins){if(skins[k]){skins[k].owned=data.skins[k].owned;}}}
}
function switchAuth(t){document.getElementById('loginForm').style.display=t==='login'?'block':'none';document.getElementById('signupForm').style.display=t==='signup'?'block':'none';document.getElementById('tabLogin').classList.toggle('active',t==='login');document.getElementById('tabSignup').classList.toggle('active',t==='signup');}
function doSignup(){const name=document.getElementById('signupName').value.trim();const email=document.getElementById('signupEmail').value.trim();const pass=document.getElementById('signupPass').value;const err=document.getElementById('signupError');err.innerText='';if(!name||!email||pass.length<6){err.innerText='Bitte alles ausfüllen';return;}auth.createUserWithEmailAndPassword(email,pass).then(cred=>cred.user.updateProfile({displayName:name}).then(()=>{loadGame();saveGame();})).catch(e=>err.innerText=e.message);}
function doLogin(){const email=document.getElementById('loginEmail').value.trim();const pass=document.getElementById('loginPass').value;const err=document.getElementById('loginError');err.innerText='';auth.signInWithEmailAndPassword(email,pass).catch(e=>err.innerText=e.message);}
function logout(){auth.signOut();}
auth.onAuthStateChanged(user=>{if(user){currentUser=user;document.getElementById('welcomeUser').innerText='Hi, '+(user.displayName||'Spieler');loadGame();db.ref('users/'+user.uid).once('value').then(snap=>{const cloud=snap.val();if(cloud){coins=cloud.coins??coins;best=cloud.best??best;currentSkin=cloud.currentSkin??currentSkin;hasShield=cloud.hasShield??hasShield;shieldEquipped=cloud.shieldEquipped??shieldEquipped;hasDoubleCoins=cloud.hasDoubleCoins??hasDoubleCoins;if(cloud.skins){for(let k in cloud.skins)if(skins[k])skins[k].owned=cloud.skins[k].owned;}localStorage.setItem("rrt_flappy_save",JSON.stringify(cloud));}else{saveGame();}document.getElementById('loginPanel').style.display='none';menu.style.display='flex';updateUI();loadLeaderboard();});}else{currentUser=null;menu.style.display='none';document.getElementById('loginPanel').style.display='block';}});
function openLeaderboard(){document.getElementById('leaderboardPanel').style.display='block';setTimeout(()=>document.getElementById('leaderboardPanel').classList.add('show'),10);loadLeaderboard();}
function closeLeaderboard(){document.getElementById('leaderboardPanel').classList.remove('show');setTimeout(()=>document.getElementById('leaderboardPanel').style.display='none',200);}
function loadLeaderboard(){db.ref('leaderboard').orderByChild('best').limitToLast(10).once('value').then(snap=>{const arr=[];snap.forEach(c=>arr.push(c.val()));arr.reverse();document.getElementById('leaderboardList').innerHTML=arr.map((u,i)=>`<div style="background:#222;margin:5px;padding:10px;border-radius:8px">${i+1}. <b>${u.name||'Anonym'}</b> - ${u.best||0}</div>`).join('')||'Noch keine Einträge';});}
async function checkUpdate(){try{const res=await fetch("update.json?t="+Date.now());const data=await res.json();const lastSeen=localStorage.getItem("rrt_version_seen");if(data.version!==GAME_VERSION&&data.version!==lastSeen){if(confirm(`🔥 UPDATE ${data.version} available!\n\n${data.message}\n\nUpdate now?`)){localStorage.setItem("rrt_version_seen",data.version);location.reload();}}}catch(e){}}setInterval(()=>{if(state==="game"||state==="menu")checkUpdate();},30000);
const AC=window.AudioContext||window.webkitAudioContext;const audio=new AC();function music(){const notes=[440,660,550,440,330,440,550,660];let i=0;setInterval(()=>{if(state!=="game")return;if(audio.state==="suspended")audio.resume();let o=audio.createOscillator();let g=audio.createGain();o.type="sine";o.frequency.value=notes[i%notes.length];g.gain.value=0.05;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+0.12);i++;},150);}music();function beep(f=440){if(audio.state==="suspended")audio.resume();let o=audio.createOscillator();let g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=f;g.gain.value=0.08;o.start();g.gain.exponentialRampToValueAtTime(0.0001,audio.currentTime+0.1);o.stop(audio.currentTime+0.1);}
let skins={default:{price:0,owned:true,color:"yellow",name:"Classic"},red:{price:10,owned:false,color:"red",name:"Red"},blue:{price:10,owned:false,color:"blue",name:"Blue"},green:{price:10,owned:false,color:"lime",name:"Green"},spiderman:{price:20,owned:false,color:"#FF0000",secondary:"#0066FF",name:"Spider-Man",effect:"web"},superman:{price:20,owned:false,color:"#0066FF",secondary:"#FF0000",name:"Superman",effect:"cape"},batman:{price:20,owned:false,color:"#000000",secondary:"#111111",name:"Batman",effect:"smoke"},ironman:{price:20,owned:false,color:"#FF0000",secondary:"#FFD700",name:"Iron Man",effect:"sparks"},flash:{price:20,owned:false,color:"#FF0000",secondary:"#FFFF00",name:"Flash",effect:"lightning"},goku:{price:20,owned:false,color:"#FF6600",secondary:"#0099FF",name:"Goku",effect:"aura"}};let currentSkin="default";
let particles=[];function spawnParticle(x,y,type="normal",vx=0,vy=0){let colors={normal:"white",web:"#FFFFFF",cape:"#FF0000",smoke:"#333333",sparks:"#FFD700",lightning:"#FFFF00",aura:"#00BFFF",trail:"#FFFFFF"};particles.push({x,y,vx:vx||(Math.random()-0.5)*4,vy:vy||(Math.random()-0.5)*4,life:30,color:colors[type]||"white",size:type==="aura"?8:type==="lightning"?2:type==="trail"?4:3,type:type});}
function reset(){bird={x:100,y:300,vel:0,angle:0,invincible:0,animFrame:0,jumpEffect:0};pipes=[];score=0;doubleCoinsActive=hasDoubleCoins;if(hasDoubleCoins){hasDoubleCoins=false;saveGame();renderDoubleCoinsBtn();}}
function startGame(){reset();state="game";menu.style.display="none";dead.style.display="none";}
function backMenu(){state="menu";menu.style.display="flex";dead.style.display="none";updateUI();saveGame();}
function openShop(){shop.style.display="block";shop.classList.add("show");renderShop();renderShieldBtn();renderDoubleCoinsBtn();}
function closeShop(){shop.style.display="none";shop.classList.remove("show");saveGame();}
async function openUpdates(){updates.style.display="block";requestAnimationFrame(()=>{updates.classList.add("show");});log.innerHTML="Loading...";try{const res=await fetch("update.json?t="+Date.now());if(!res.ok)throw new Error("HTTP "+res.status);const data=await res.json();if(data.patchNotes){log.innerHTML=`<b>Version ${data.version}</b><br><br>`+data.patchNotes.map(t=>`• ${t}`).join("<br>");return;}log.innerHTML="No updates found";}catch(err){log.innerHTML="❌ Failed to load updates";console.error(err);}}
function closeUpdates(){updates.classList.remove("show");setTimeout(()=>{updates.style.display="none";},200);}
function tab(t){skinsTab.style.display=t==="skins"?"block":"none";document.getElementById('upgradesTab').style.display=t==="upgrades"?"block":"none";document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));event.target.classList.add('active');}
function renderShop(){let html="";for(let k in skins){let s=skins[k];let btnTxt="BUY";let btnDisabled="";if(s.owned){if(currentSkin===k){btnTxt="EQUIPPED";btnDisabled="disabled";}else{btnTxt="EQUIP";}}html+=`<div class='shopItem'>${s.name}<br>Price:${s.price}<br><canvas id='p_${k}' width='100' height='50' class='preview'></canvas><br><button onclick="${s.owned?`equip('${k}')`:`buySkin('${k}')`}" ${btnDisabled}>${btnTxt}</button></div>`;}skinsTab.innerHTML=html;for(let k in skins)drawPreview(k);}
function buySkin(k){let s=skins[k];if(coins>=s.price){coins-=s.price;s.owned=true;currentSkin=k;updateUI();renderShop();saveGame();beep(800);}}
function equip(k){currentSkin=k;renderShop();saveGame();beep(600);}
function buyShield(){if(coins>=50&&!hasShield){coins-=50;hasShield=true;shieldEquipped=true;updateUI();renderShieldBtn();saveGame();beep(800);}}
function renderShieldBtn(){const btn=document.getElementById("shieldBtn");if(!btn)return;if(!hasShield){btn.innerText="BUY 50";btn.disabled=false;btn.onclick=buyShield;}else if(shieldEquipped){btn.innerText="EQUIPPED";btn.disabled=true;}else{btn.innerText="EQUIP";btn.disabled=false;btn.onclick=()=>{shieldEquipped=true;renderShieldBtn();saveGame();beep(600);}}}
function buyDoubleCoins(){if(coins>=200&&!hasDoubleCoins){coins-=200;hasDoubleCoins=true;updateUI();renderDoubleCoinsBtn();saveGame();beep(800);}}
function renderDoubleCoinsBtn(){const btn=document.getElementById("doubleCoinsBtn");if(!btn)return;if(!hasDoubleCoins){btn.innerText="BUY 200";btn.disabled=false;btn.onclick=buyDoubleCoins;}else{btn.innerText="READY FOR NEXT ROUND";btn.disabled=true;}}
function drawPreview(k){let canvas=document.getElementById("p_"+k);if(!canvas)return;let ctx=canvas.getContext("2d");let t=0;function loop(){ctx.clearRect(0,0,100,50);t+=0.1;let s=skins[k];let scale=1;let rot=0;if(k==="flash")rot=Math.sin(t*10)*0.3;if(k==="goku")scale=1+Math.sin(t*5)*0.1;if(k==="ironman")scale=1+Math.sin(t*8)*0.05;ctx.save();ctx.translate(50,25);ctx.scale(scale,scale);ctx.rotate(rot);ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();if(s.secondary){ctx.fillStyle=s.secondary;ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();}ctx.fillStyle="white";if(k==="batman"){ctx.beginPath();ctx.moveTo(3,-3);ctx.lineTo(6,-2);ctx.lineTo(3,-1);ctx.fill();ctx.moveTo(3,3);ctx.lineTo(6,2);ctx.lineTo(3,1);ctx.fill();}else{ctx.beginPath();ctx.arc(3,-3,3,0,Math.PI*2);ctx.arc(3,3,3,0,Math.PI*2);ctx.fill();ctx.fillStyle="black";ctx.beginPath();ctx.arc(4,-3,1.3,0,Math.PI*2);ctx.arc(4,3,1.3,0,Math.PI*2);ctx.fill();}if(k==="superman"){ctx.fillStyle="#FF0000";ctx.font="bold 8px Arial";ctx.textAlign="center";ctx.fillText("S",0,3);}if(k==="goku"){ctx.fillStyle="#000";ctx.font="bold 8px Arial";ctx.textAlign="center";ctx.fillText("亀",0,3);}if(k==="ironman"){ctx.fillStyle="#FFFF00";ctx.shadowBlur=10;ctx.shadowColor="#FFFF00";ctx.beginPath();ctx.arc(3,-3,2,0,Math.PI*2);ctx.arc(3,3,2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}let flap=Math.sin(t*8);ctx.fillStyle="rgba(255,255,255,0.9)";ctx.beginPath();if(flap>0){ctx.moveTo(-10,0);ctx.quadraticCurveTo(-35,-15,-20,-8);ctx.quadraticCurveTo(-12,-5,-10,0);}else{ctx.moveTo(-10,0);ctx.quadraticCurveTo(-35,15,-20,8);ctx.quadraticCurveTo(-12,5,-10,0);}ctx.fill();ctx.restore();requestAnimationFrame(loop);}loop();}
document.addEventListener("keydown",e=>{if(e.code==="Space")jump();});c.addEventListener("touchstart",e=>{e.preventDefault();jump();});c.addEventListener("click",()=>jump());function jump(){if(state!=="game")return;bird.vel=-6;bird.jumpEffect=10;beep(520);let skin=skins[currentSkin];let effect=skin.effect||"normal";if(effect==="web"){for(let i=0;i<8;i++)spawnParticle(bird.x,bird.y,"web",-Math.random()*3-2,(Math.random()-0.5)*4);}else if(effect==="sparks"){for(let i=0;i<12;i++)spawnParticle(bird.x,bird.y,"sparks",(Math.random()-0.5)*5,(Math.random()-0.5)*5);}else if(effect==="lightning"){for(let i=0;i<10;i++)spawnParticle(bird.x,bird.y,"lightning",-Math.random()*6-3,0);}else if(effect==="smoke"){for(let i=0;i<6;i++)spawnParticle(bird.x,bird.y,"smoke",-Math.random()*2-1,(Math.random()-0.5)*2);}else{spawnParticle(bird.x,bird.y);}}
let pipeGap=150;let speed=3;function difficulty(){pipeGap=Math.max(90,150-score*2);speed=3+score*0.05;}
function update(){if(state!=="game")return;difficulty();bird.vel+=0.35;bird.y+=bird.vel;bird.angle=bird.vel*0.08;bird.animFrame++;if(bird.jumpEffect>0)bird.jumpEffect--;if(bird.invincible>0)bird.invincible--;if(frame%90===0){pipes.push({x:400,top:100+Math.random()*250,passed:false});}for(let p of pipes){p.x-=speed;if(!p.passed&&p.x<bird.x){p.passed=true;score++;coins+=doubleCoinsActive?2:1;beep(700);}if(bird.invincible<=0){if(bird.x<p.x+70&&bird.x+20>p.x&&(bird.y<p.top||bird.y>p.top+pipeGap))die();}}let skin=skins[currentSkin];if(skin.effect==="aura"){for(let i=0;i<3;i++)spawnParticle(bird.x+(Math.random()-0.5)*20,bird.y+(Math.random()-0.5)*20,"aura");}if(skin.effect==="cape")spawnParticle(bird.x-15,bird.y,"cape",-2,0);if(skin.effect==="smoke")spawnParticle(bird.x-10,bird.y,"smoke",-1,0);if(skin.effect==="lightning"){spawnParticle(bird.x-20,bird.y,"trail",0,0);}if(bird.y>520||bird.y<0)die();}
function die(){if(shieldEquipped&&hasShield){hasShield=false;shieldEquipped=false;bird.y=250;bird.vel=-4;bird.invincible=60;beep(900);saveGame();renderShieldBtn();return;}state="dead";dead.style.display="flex";if(score>best)best=score;beep(140);updateUI();saveGame();}
function draw(){ctx.clearRect(0,0,400,600);ctx.fillStyle="#70c5ce";ctx.fillRect(0,0,400,600);ctx.fillStyle="#d2b48c";ctx.fillRect(0,520,400,80);particles=particles.filter(p=>p.life>0);for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.life--;ctx.fillStyle=p.color;ctx.globalAlpha=p.life/30;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}if(state==="game"||state==="dead"){ctx.save();ctx.translate(bird.x,bird.y);if(currentSkin==="flash"&&bird.jumpEffect>5){ctx.globalAlpha=0.3;ctx.translate(-15,0);ctx.scale(0.9,0.9);drawBird();ctx.translate(-15,0);ctx.scale(0.9,0.9);drawBird();ctx.globalAlpha=1;}ctx.rotate(bird.angle);drawBird();ctx.restore();for(let p of pipes){ctx.fillStyle="green";ctx.fillRect(p.x,0,70,p.top);ctx.fillRect(p.x,p.top+pipeGap,70,600);}ctx.fillStyle="black";ctx.font="20px Arial";ctx.textAlign="left";ctx.fillText("Score:"+score,10,30);ctx.fillText("Coins:"+coins,10,55);ctx.fillText("Best:"+best,10,80);if(doubleCoinsActive){ctx.fillStyle="#FFD700";ctx.font="bold 16px Arial";ctx.fillText("2X COINS!",10,105);}}}
function drawBird(){let s=skins[currentSkin];if(s.effect==="aura"){let auraSize=20+Math.sin(bird.animFrame*0.2)*5;ctx.shadowBlur=20;ctx.shadowColor=s.secondary;ctx.strokeStyle=s.secondary;ctx.lineWidth=3;ctx.globalAlpha=0.4;ctx.beginPath();ctx.arc(0,0,auraSize,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;ctx.shadowBlur=0;}if(shieldEquipped&&hasShield){ctx.strokeStyle=bird.invincible>0?"cyan":"lime";ctx.lineWidth=3;ctx.globalAlpha=bird.invincible>0?0.3:0.6;ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;}if(s.effect==="cape"){let capeWave=Math.sin(bird.animFrame*0.3)*5;ctx.fillStyle=s.secondary;ctx.beginPath();ctx.moveTo(-10,-5);ctx.lineTo(-25+capeWave,0);ctx.lineTo(-10,5);ctx.closePath();ctx.fill();}let scaleX=1,scaleY=1;if(currentSkin==="spiderman"&&bird.jumpEffect>0){scaleY=1.2;scaleX=0.9;}if(currentSkin==="ironman"&&bird.jumpEffect>0){scaleX=1.1;}ctx.save();ctx.scale(scaleX,scaleY);ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();if(s.secondary&&s.effect!=="cape"){ctx.fillStyle=s.secondary;ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();}ctx.restore();ctx.fillStyle="white";if(currentSkin==="batman"){ctx.beginPath();ctx.moveTo(4,-4);ctx.lineTo(8,-3);ctx.lineTo(4,-2);ctx.fill();ctx.moveTo(4,4);ctx.lineTo(8,3);ctx.lineTo(4,2);ctx.fill();}else{ctx.beginPath();ctx.arc(4,-3,3,0,Math.PI*2);ctx.arc(4,3,3,0,Math.PI*2);ctx.fill();ctx.fillStyle="black";ctx.beginPath();ctx.arc(5,-3,1.3,0,Math.PI*2);ctx.arc(5,3,1.3,0,Math.PI*2);ctx.fill();}if(currentSkin==="superman"){let sSize=8+Math.sin(bird.animFrame*0.2)*1;ctx.fillStyle="#FF0000";ctx.font=`bold ${sSize}px Arial`;ctx.textAlign="center";ctx.fillText("S",0,3);}if(currentSkin==="goku"){ctx.fillStyle="#000";ctx.font="bold 8px Arial";ctx.textAlign="center";ctx.fillText("亀",0,3);}if(currentSkin==="ironman"){let glow=10+Math.sin(bird.animFrame*0.3)*5;ctx.fillStyle="#FFFF00";ctx.shadowBlur=glow;ctx.shadowColor="#FFFF00";ctx.beginPath();ctx.arc(4,-3,2,0,Math.PI*2);ctx.arc(4,3,2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}let flap=Math.sin(frame*0.8+bird.jumpEffect*0.5);let wingColor="rgba(255,255,255,0.9)";if(currentSkin==="flash")wingColor="rgba(255,255,0,0.9)";if(currentSkin==="goku")wingColor="rgba(0,191,255,0.7)";ctx.fillStyle=wingColor;ctx.beginPath();if(flap>0){ctx.moveTo(-2,0);ctx.quadraticCurveTo(-25,-15,-10,-8);ctx.quadraticCurveTo(-5,-5,-2,0);}else{ctx.moveTo(-2,0);ctx.quadraticCurveTo(-25,15,-10,8);ctx.quadraticCurveTo(-5,5,-2,0);}ctx.fill();if(currentSkin==="goku"){ctx.strokeStyle=s.secondary;ctx.lineWidth=2;ctx.globalAlpha=0.5;ctx.stroke();ctx.globalAlpha=1;}if(currentSkin==="ironman"){ctx.shadowBlur=15;ctx.shadowColor=s.secondary;}}
function loop(){frame++;update();draw();requestAnimationFrame(loop);}loop();
function updateUI(){coinsUI.innerText=coins;bestUI.innerText=best;}
checkUpdate();updateUI();renderShieldBtn();renderDoubleCoinsBtn();
</script>
