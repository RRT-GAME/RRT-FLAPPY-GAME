/* AUTH OVERLAY */
#authOverlay{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:#050507;overflow:hidden}

#authOverlay .card{position:relative;z-index:2;width:92%;max-width:380px;background:rgba(255,255,255,.06);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:32px;box-shadow:0 25px 80px #0009}

#authOverlay .tab{flex:1;padding:10px;text-align:center;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;opacity:.7;transition:.2s;color:#fff}

#authOverlay .input{width:100%;padding:14px 16px;margin:8px 0;background:#0006;border:1px solid #fff1;border-radius:12px;color:#fff;font-size:15px;outline:none;box-sizing:border-box}
#authOverlay .input:focus{border-color:#ff9500;box-shadow:0 0 0 3px #ff950026}
#authOverlay .btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px;transition:.2s;min-width:unset;max-width:100%}

#authOverlay .error{color:#ff5c5c;font-size:13px;min-height:18px;margin-top:8px;text-align:center}
#authOverlay .hidden{display:none}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { getDatabase, ref, set, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const cfg = {apiKey:"AIzaSyBBRFz8drGGRp_kpUR5HiIisR6WYdFnqI4",authDomain:"rrt-flappy-game.firebaseapp.com",databaseURL:"https://rrt-flappy-game-default-rtdb.europe-west1.firebasedatabase.app",projectId:"rrt-flappy-game",storageBucket:"rrt-flappy-game.firebasestorage.app",messagingSenderId:"376438140987",appId:"1:376438140987:web:15d964c26fa4a31ec4ec1e"};
const app = initializeApp(cfg);
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();

const authOverlay = document.getElementById('authOverlay');
const tLogin = document.getElementById('tLogin');
const tSignup = document.getElementById('tSignup');
const fLogin = document.getElementById('fLogin');
const fSignup = document.getElementById('fSignup');
const email1 = document.getElementById('email1');
const pass1 = document.getElementById('pass1');
const email2 = document.getElementById('email2');
const pass2 = document.getElementById('pass2');
const btnLogin = document.getElementById('btnLogin');
const btnSignup = document.getElementById('btnSignup');
const btnGoogle = document.getElementById('btnGoogle');
const authErr = document.getElementById('authErr');
const userInfo = document.getElementById('userInfo');

const btnGuest = document.getElementById('btnGuest');
const forgotLink = document.getElementById('forgotLink');
const nameSetup = document.getElementById('nameSetup');
const nameInput = document.getElementById('nameInput');
const saveNameBtn = document.getElementById('saveNameBtn');
window.isGuest = false;

if(btnGuest){
  btnGuest.onclick = ()=>{
    window.isGuest = true;
    window.currentUser = null;
    authOverlay.style.display='none';
    if(userInfo) userInfo.textContent = 'Gast-Modus';
    const lb = document.getElementById('lbBtn'); if(lb) lb.style.opacity='0.5';
    if(window._gameLoad) window._gameLoad();
  };
}
if(forgotLink){
  forgotLink.onclick = async ()=>{
    const email = prompt('Deine Email für Reset:');
    if(!email) return;
    try{ await sendPasswordResetEmail(auth, email); alert('Email gesendet!'); }
    catch(e){ alert('Fehler'); }
  };
}

async function askName(){
  return new Promise(res=>{
    nameSetup.style.display='flex';
    saveNameBtn.onclick = ()=>{
      const n = nameInput.value.trim().slice(0,16);
      if(n.length<2) return;
      nameSetup.style.display='none';
      res(n);
    };
  });
}

window.openLB = async ()=>{
  if(window.isGuest || !auth.currentUser){ alert('Nur für eingeloggte Spieler'); return; }
  const p = document.getElementById('leaderboard'); p.style.display='block'; setTimeout(()=>p.classList.add('show'),10);
  const list = document.getElementById('lbList'); list.innerHTML='Lade...';
  try{
    const snap = await get(ref(db, 'leaderboard'));
    const arr = []; snap.forEach(c=>arr.push(c.val()));
    arr.sort((a,b)=>b.coins-a.coins);
    list.innerHTML = arr.slice(0,50).map((u,i)=>{
      const verified = u.email==='rojatcankunduru708@gmail' && u.displayName==='RRT';
      return `<div style="display:flex;justify-content:space-between;background:#222;margin:5px;padding:8px;border-radius:8px"><span>${i+1}. ${u.displayName} ${verified?'<span style="color:#3b82f6">✓</span>':''}</span><b>${u.coins}🪙</b></div>`;
    }).join('');
  }catch(e){ list.innerHTML='Fehler'; }
};
window.closeLB = ()=>{ const p=document.getElementById('leaderboard'); p.classList.remove('show'); setTimeout(()=>p.style.display='none',200); };

window.openSettings = ()=>{
  const p=document.getElementById('settingsPanel'); const b=document.getElementById('settingsBody');
  if(window.isGuest || !auth.currentUser){
    b.innerHTML = '<button onclick="document.getElementById(\'authOverlay\').style.display=\'flex\';closeSettings()" style="width:100%;padding:10px">Einloggen</button>';
  }else{
    b.innerHTML = `<p>${auth.currentUser.email}</p><button onclick="changeName()" style="width:100%;margin:5px 0">Name ändern</button><button onclick="logout()" style="width:100%;margin:5px 0">Ausloggen</button>`;
  }
  p.style.display='block'; setTimeout(()=>p.classList.add('show'),10);
};
window.closeSettings = ()=>{ const p=document.getElementById('settingsPanel'); p.classList.remove('show'); setTimeout(()=>p.style.display='none',200); };
window.changeName = async ()=>{ const n=await askName(); if(window._fbData){ window._fbData.displayName=n; saveGame(); } };

function showTab(which){
  const isLogin = which==='login';
  tLogin.classList.toggle('active', isLogin);
  tSignup.classList.toggle('active', !isLogin);
  fLogin.classList.toggle('hidden', !isLogin);
  fSignup.classList.toggle('hidden', isLogin);
  authErr.textContent='';
}
tLogin.onclick = ()=>showTab('login');
tSignup.onclick = ()=>showTab('signup');

btnLogin.onclick = async ()=>{
  authErr.textContent='';
  try{
    await signInWithEmailAndPassword(auth, email1.value.trim(), pass1.value);
  }catch(e){
    authErr.textContent = 'Falsche Email oder Passwort';
  }
};
btnSignup.onclick = async ()=>{
  authErr.textContent='';
  if(pass2.value.length<6){ authErr.textContent='Passwort zu kurz'; return; }
  try{
    await createUserWithEmailAndPassword(auth, email2.value.trim(), pass2.value);
  }catch(e){
    authErr.textContent = e.code==='auth/email-already-in-use' ? 'Email existiert bereits' : 'Fehler bei Registrierung';
  }
};
btnGoogle.onclick = async ()=>{
  authErr.textContent='';
  try{ await signInWithPopup(auth, provider); }catch(e){ authErr.textContent='Google Login abgebrochen'; }
};

window.logout = ()=> signOut(auth);

window.saveToFirebase = async (data)=>{
  if(!auth.currentUser) return;
  try{
    const displayName = window._fbData?.displayName || auth.currentUser.email.split('@')[0];
    await set(ref(db, 'users/'+auth.currentUser.uid), {
      displayName,
      coins: data.coins,
      best: data.best,
      currentSkin: data.currentSkin,
      hasShield: data.hasShield,
      shieldEquipped: data.shieldEquipped,
      hasDoubleCoins: data.hasDoubleCoins,
      skins: data.skins,
      email: auth.currentUser.email,
      lastLogin: serverTimestamp()
    });
    await set(ref(db, 'leaderboard/'+auth.currentUser.uid), {displayName, coins: data.coins||0, best: data.best||0, email: auth.currentUser.email, updatedAt: Date.now()});
  }catch(e){ 
    console.error('Firebase save failed', e);
  }
};

onAuthStateChanged(auth, async (user)=>{
  window.currentUser = user;
  if(user){
    authOverlay.style.display='none';
    window.isGuest=false;
    if(userInfo) userInfo.textContent = 'Lade Cloud-Daten...';
    try{
      const snap = await get(ref(db, 'users/'+user.uid));
      let needName = false;
      if(snap.exists()){
        window._fbData = snap.val();
        if(!window._fbData.displayName){ needName=true; }
        localStorage.setItem('rrt_flappy_save', JSON.stringify(window._fbData));
      } else {
        const local = localStorage.getItem('rrt_flappy_save');
        if(local){
          try{
            const data = JSON.parse(local);
            await set(ref(db, 'users/'+user.uid), {...data, email:user.email, lastLogin: serverTimestamp()});
            window._fbData = data;
          }catch(e){ console.error(e); }
        } else {
          window._fbData = null;
        }
      }
      if(needName){ const n=await askName(); window._fbData.displayName=n; await window.saveToFirebase(window._fbData); }
    }catch(e){ 
      console.error('Firebase load failed', e);
    }
    if(typeof window._gameLoad === 'function') window._gameLoad();
    if(userInfo) userInfo.textContent = 'Eingeloggt als: ' + user.email;
  }else{
    authOverlay.style.display='flex';
    if(userInfo) userInfo.textContent = '';
    window._fbData = null;
    if(typeof window._gameLoad === 'function') window._gameLoad();
  }
});
</script>

<script>
const GAME_VERSION = "1.1.0";
const c=document.getElementById("game");
const ctx=c.getContext("2d");

const menu=document.getElementById("menu");
const dead=document.getElementById("dead");
const shop=document.getElementById("shop");
const updates=document.getElementById("updates");
const log=document.getElementById("log");
const coinsUI=document.getElementById("coinsUI");
const bestUI=document.getElementById("bestUI");
const skinsTab=document.getElementById("skinsTab");
const upgradesTab=document.getElementById("upgradesTab");

let state="menu";
let bird,pipes=[];
let score=0,coins=0,best=0;
let frame=0;
let hasShield = false;
let shieldEquipped = false;
let hasDoubleCoins = false;
let doubleCoinsActive = false;

function saveGame(){
  const data = {
    coins,
    best,
    skins,
    currentSkin,
    hasShield,
    shieldEquipped,
    hasDoubleCoins
  };
  localStorage.setItem("rrt_flappy_save", JSON.stringify(data));
  if(window.currentUser && window.saveToFirebase){
    window.saveToFirebase(data);
  }
}

function loadGame(){
  const fbData = window._fbData;
  const localData = JSON.parse(localStorage.getItem("rrt_flappy_save"));
  const data = fbData ?? localData;
  if(!data) return;

  coins = data.coins?? 0;
  best = data.best?? 0;
  currentSkin = data.currentSkin?? "default";
  hasShield = data.hasShield?? false;
  shieldEquipped = data.shieldEquipped?? false;
  hasDoubleCoins = data.hasDoubleCoins?? false;

  if(data.skins){
    for(let k in data.skins){
      if(skins[k]){
        skins[k].owned = data.skins[k].owned;
      }
    }
  }
  if(fbData){
    localStorage.setItem("rrt_flappy_save", JSON.stringify(fbData));
  }
}
window._gameLoad = ()=>{
  loadGame();
  updateUI();
  if(typeof renderShieldBtn==='function') renderShieldBtn();
  if(typeof renderDoubleCoinsBtn==='function') renderDoubleCoinsBtn();
  if(typeof renderShop==='function' && document.getElementById('shop').style.display!=='none') renderShop();
};

async function checkUpdate(){
  try{
    const res = await fetch("update.json?t=" + Date.now());
    const data = await res.json();
    const lastSeen = localStorage.getItem("rrt_version_seen");
    if(data.version!== GAME_VERSION && data.version!== lastSeen){
      if(confirm(`🔥 UPDATE ${data.version} verfügbar!\n\n${data.message}\n\nJetzt aktualisieren?`)){
        localStorage.setItem("rrt_version_seen", data.version);
        location.reload();
      }
    }
  }catch(e){}
}
setInterval(() => {
  if(state === "game" || state === "menu") checkUpdate();
}, 30000);

const AC=window.AudioContext||window.webkitAudioContext;
const audio=new AC();

function music(){
const notes=[440,660,550,440,330,440,550,660];
let i=0;
setInterval(()=>{
if(state!=="game")return;
if(audio.state==="suspended")audio.resume();
let o=audio.createOscillator();
let g=audio.createGain();
o.type="sine"; o.frequency.value=notes[i%notes.length]; g.gain.value=0.05;
o.connect(g); g.connect(audio.destination);
o.start(); o.stop(audio.currentTime+0.12); i++;
},150);
}
music();

function beep(f=440){
if(audio.state==="suspended")audio.resume();
let o=audio.createOscillator(); let g=audio.createGain();
o.connect(g);g.connect(audio.destination); o.frequency.value=f; g.gain.value=0.08;
o.start(); g.gain.exponentialRampToValueAtTime(0.0001,audio.currentTime+0.1); o.stop(audio.currentTime+0.1);
}

let skins={
default:{price:0,owned:true,color:"yellow",name:"Classic"},
red:{price:10,owned:false,color:"red",name:"Red"},
blue:{price:10,owned:false,color:"blue",name:"Blue"},
green:{price:10,owned:false,color:"lime",name:"Green"},
spiderman:{price:20,owned:false,color:"#FF0000",secondary:"#0066FF",name:"Spider-Man",effect:"web"},
superman:{price:20,owned:false,color:"#0066FF",secondary:"#FF0000",name:"Superman",effect:"cape"},
batman:{price:20,owned:false,color:"#000000",secondary:"#111111",name:"Batman",effect:"smoke"},
ironman:{price:20,owned:false,color:"#FF0000",secondary:"#FFD700",name:"Iron Man",effect:"sparks"},
flash:{price:20,owned:false,color:"#FF0000",secondary:"#FFFF00",name:"Flash",effect:"lightning"},
goku:{price:20,owned:false,color:"#FF6600",secondary:"#0099FF",name:"Goku",effect:"aura"}
};
let currentSkin="default";

let particles=[];
function spawnParticle(x,y,type="normal",vx=0,vy=0){
let colors = { normal:"white", web:"#FFFFFF", cape:"#FF0000", smoke:"#333333", sparks:"#FFD700", lightning:"#FFFF00", aura:"#00BFFF", trail:"#FFFFFF" };
particles.push({ x,y, vx:vx||(Math.random()-0.5)*4, vy:vy||(Math.random()-0.5)*4, life:30, color:colors[type]||"white", size:type==="aura"?8:type==="lightning"?2:type==="trail"?4:3, type });
}

function reset(){
  bird={x:100,y:300,vel:0,angle:0,invincible:0,animFrame:0,jumpEffect:0};
  pipes=[]; score=0;
  doubleCoinsActive = hasDoubleCoins;
  if(hasDoubleCoins){ hasDoubleCoins = false; saveGame(); renderDoubleCoinsBtn(); }
}
function startGame(){reset();state="game";menu.style.display="none";dead.style.display="none";}
function backMenu(){state="menu";menu.style.display="flex";dead.style.display="none";updateUI();saveGame();}

function openShop(){shop.style.display="block";setTimeout(()=>shop.classList.add("show"),10);renderShop();renderShieldBtn();renderDoubleCoinsBtn();}
function closeShop(){shop.classList.remove("show");setTimeout(()=>shop.style.display="none",200);saveGame();}

async function openUpdates(){
  updates.style.display="block";
  requestAnimationFrame(()=>{ updates.classList.add("show"); });
  log.innerHTML = "Loading...";
  try {
    const res = await fetch("update.json?t=" + Date.now());
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if(data.patchNotes){
      log.innerHTML = `<b>Version ${data.version}</b><br><br>` + data.patchNotes.map(t => `• ${t}`).join("<br>");
      return;
    }
    log.innerHTML = "Keine Updates gefunden";
  } catch (err) {
    log.innerHTML = "❌ Updates konnten nicht geladen werden";
  }
}

function closeUpdates(){
  updates.classList.remove("show");
  setTimeout(()=>{ updates.style.display="none"; }, 200);
}

function tab(t, el){
skinsTab.style.display=t==="skins"?"block":"none";
upgradesTab.style.display=t==="upgrades"?"block":"none";
document.querySelectorAll('#shop .tab').forEach(e=>e.classList.remove('active'));
if(el) el.classList.add('active');
}

function renderShop(){
let html="";
for(let k in skins){
let s=skins[k];
let btnTxt = "BUY"; let btnDisabled = "";
if(s.owned){ btnTxt = currentSkin===k ? "EQUIPPED" : "EQUIP"; btnDisabled = currentSkin===k ? "disabled" : ""; }
html+=`<div class='shopItem'>${s.name}<br>Price:${s.price}<br><canvas id='p_${k}' width='100' height='50' class='preview'></canvas><br><button onclick="${s.owned?`equip('${k}')`:`buySkin('${k}')`}" ${btnDisabled}>${btnTxt}</button></div>`;
}
skinsTab.innerHTML=html;
for(let k in skins) drawPreview(k);
}

function buySkin(k){
let s=skins[k];
if(coins>=s.price){ coins-=s.price; s.owned=true; currentSkin=k; updateUI(); renderShop(); saveGame(); beep(800); }
}
function equip(k){currentSkin=k;renderShop();saveGame();beep(600);}

function buyShield(){
  if(coins >= 50 &&!hasShield){ coins -= 50; hasShield = true; shieldEquipped = true; updateUI(); renderShieldBtn(); saveGame(); beep(800); }
}
function renderShieldBtn(){
  const btn = document.getElementById("shieldBtn"); if(!btn) return;
  if(!hasShield){ btn.innerText = "BUY 50"; btn.disabled = false; btn.onclick = buyShield; }
  else if(shieldEquipped){ btn.innerText = "EQUIPPED"; btn.disabled = true; }
  else{ btn.innerText = "EQUIP"; btn.disabled = false; btn.onclick = () => { shieldEquipped = true; renderShieldBtn(); saveGame(); beep(600); } }
}

function buyDoubleCoins(){
  if(coins >= 200 &&!hasDoubleCoins){ coins -= 200; hasDoubleCoins = true; updateUI(); renderDoubleCoinsBtn(); saveGame(); beep(800); }
}
function renderDoubleCoinsBtn(){
  const btn = document.getElementById("doubleCoinsBtn"); if(!btn) return;
  if(!hasDoubleCoins){ btn.innerText = "BUY 200"; btn.disabled = false; btn.onclick = buyDoubleCoins; }
  else{ btn.innerText = "READY FOR NEXT ROUND"; btn.disabled = true; }
}

function drawPreview(k){
let canvas=document.getElementById("p_"+k); if(!canvas)return; let ctx=canvas.getContext("2d"); let t=0;
function loop(){
ctx.clearRect(0,0,100,50); t+=0.1; let s=skins[k];
let scale = 1; let rot = 0;
if(k === "flash") rot = Math.sin(t*10)*0.3;
if(k === "goku") scale = 1 + Math.sin(t*5)*0.1;
if(k === "ironman") scale = 1 + Math.sin(t*8)*0.05;
ctx.save(); ctx.translate(50,25); ctx.scale(scale,scale); ctx.rotate(rot);
ctx.fillStyle=s.color; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
if(s.secondary){ ctx.fillStyle=s.secondary; ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill(); }
ctx.fillStyle="white";
if(k === "batman"){ ctx.beginPath(); ctx.moveTo(3,-3); ctx.lineTo(6,-2); ctx.lineTo(3,-1); ctx.fill(); ctx.moveTo(3,3); ctx.lineTo(6,2); ctx.lineTo(3,1); ctx.fill(); }
else{ ctx.beginPath(); ctx.arc(3,-3,3,0,Math.PI*2); ctx.arc(3,3,3,0,Math.PI*2); ctx.fill(); ctx.fillStyle="black"; ctx.beginPath(); ctx.arc(4,-3,1.3,0,Math.PI*2); ctx.arc(4,3,1.3,0,Math.PI*2); ctx.fill(); }
if(k === "superman"){ ctx.fillStyle="#FF0000"; ctx.font="bold 8px Arial"; ctx.textAlign="center"; ctx.fillText("S",0,3); }
if(k === "goku"){ ctx.fillStyle="#000"; ctx.font="bold 8px Arial"; ctx.textAlign="center"; ctx.fillText("亀",0,3); }
if(k === "ironman"){ ctx.fillStyle="#FFFF00"; ctx.shadowBlur = 10; ctx.shadowColor = "#FFFF00"; ctx.beginPath(); ctx.arc(3,-3,2,0,Math.PI*2); ctx.arc(3,3,2,0,Math.PI*2); ctx.fill(); ctx.shadowBlur = 0; }
let flap=Math.sin(t*8); ctx.fillStyle="rgba(255,255,255,0.9)"; ctx.beginPath();
if(flap>0){ ctx.moveTo(-10,0); ctx.quadraticCurveTo(-35,-15,-20,-8); ctx.quadraticCurveTo(-12,-5,-10,0); }else{ ctx.moveTo(-10,0); ctx.quadraticCurveTo(-35,15,-20,8); ctx.quadraticCurveTo(-12,5,-10,0); }
ctx.fill(); ctx.restore(); requestAnimationFrame(loop);
}
loop();
}

document.addEventListener("keydown",e=>{if(e.code==="Space")jump();});
c.addEventListener("touchstart",e=>{e.preventDefault();jump();},{passive:false});
c.addEventListener("click",()=>jump());
function jump(){
  if(state!=="game")return; bird.vel=-6; bird.jumpEffect = 10; beep(520);
  let skin = skins[currentSkin]; let effect = skin.effect || "normal";
  if(effect === "web") { for(let i=0;i<8;i++) spawnParticle(bird.x,bird.y,"web",-Math.random()*3-2,(Math.random()-0.5)*4); }
  else if(effect === "sparks") { for(let i=0;i<12;i++) spawnParticle(bird.x,bird.y,"sparks",(Math.random()-0.5)*5,(Math.random()-0.5)*5); }
  else if(effect === "lightning") { for(let i=0;i<10;i++) spawnParticle(bird.x,bird.y,"lightning",-Math.random()*6-3,0); }
  else if(effect === "smoke") { for(let i=0;i<6;i++) spawnParticle(bird.x,bird.y,"smoke",-Math.random()*2-1,(Math.random()-0.5)*2); }
  else { spawnParticle(bird.x,bird.y); }
}

let pipeGap=150; let speed=3;
function difficulty(){pipeGap=Math.max(90,150-score*2);speed=3+score*0.05;}

function update(){
if(state!=="game")return; difficulty();
bird.vel+=0.35; bird.y+=bird.vel; bird.angle=Math.max(-0.5,Math.min(0.5,bird.vel*0.08)); bird.animFrame++; if(bird.jumpEffect > 0) bird.jumpEffect--; if(bird.invincible > 0) bird.invincible--;
if(frame%90===0){ pipes.push({x:400,top:100+Math.random()*250,passed:false}); }
for(let p of pipes){
p.x-=speed;
if(!p.passed && p.x<bird.x){ p.passed=true; score++; coins += doubleCoinsActive? 2 : 1; beep(700); }
if(bird.invincible <= 0){ if(bird.x+15>p.x && bird.x-15<p.x+70 && (bird.y-12<p.top||bird.y+12>p.top+pipeGap))die(); }
}
pipes = pipes.filter(p=>p.x>-80);
let skin = skins[currentSkin];
if(skin.effect === "aura") { for(let i=0;i<3;i++) spawnParticle(bird.x+(Math.random()-0.5)*20,bird.y+(Math.random()-0.5)*20,"aura"); }
if(skin.effect === "cape") spawnParticle(bird.x-15,bird.y,"cape",-2,0);
if(skin.effect === "smoke") spawnParticle(bird.x-10,bird.y,"smoke",-1,0);
if(skin.effect === "lightning") { spawnParticle(bird.x-20,bird.y,"trail",0,0); }
if(bird.y>520||bird.y<0)die();
}

function die(){
  if(shieldEquipped && hasShield){ hasShield = false; shieldEquipped = false; bird.y = 250; bird.vel = -4; bird.invincible = 60; beep(900); saveGame(); renderShieldBtn(); for(let i=0;i<20;i++) spawnParticle(bird.x,bird.y,"sparks"); return; }
  state="dead"; dead.style.display="flex"; if(score>best)best=score; beep(140); updateUI(); saveGame();
}

function draw(){
ctx.clearRect(0,0,400,600);
let g=ctx.createLinearGradient(0,0,0,520); g.addColorStop(0,"#70c5ce"); g.addColorStop(1,"#5ab4c7"); ctx.fillStyle=g; ctx.fillRect(0,0,400,520);
ctx.fillStyle="#de9f5f"; ctx.fillRect(0,520,400,80);
ctx.fillStyle="#c68a4f"; for(let i=0;i<400;i+=40) ctx.fillRect(i,520,20,80);
particles=particles.filter(p=>p.life>0);
for(let p of particles){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life--; ctx.fillStyle=p.color; ctx.globalAlpha = Math.max(0,p.life/30); ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); ctx.globalAlpha = 1; }
if(state==="game"||state==="dead"){
for(let p of pipes){ 
  let grad=ctx.createLinearGradient(p.x,0,p.x+70,0); grad.addColorStop(0,"#2d8f2d"); grad.addColorStop(0.5,"#4caf50"); grad.addColorStop(1,"#2d8f2d");
  ctx.fillStyle=grad; ctx.fillRect(p.x,0,70,p.top); ctx.fillRect(p.x,p.top+pipeGap,70,600-p.top-pipeGap);
  ctx.fillStyle="#1b5e1b"; ctx.fillRect(p.x-3,p.top-20,76,20); ctx.fillRect(p.x-3,p.top+pipeGap,76,20);
}
ctx.save(); ctx.translate(bird.x,bird.y);
if(currentSkin === "flash" && bird.jumpEffect > 5){ ctx.globalAlpha = 0.3; ctx.translate(-15,0); ctx.scale(0.9,0.9); drawBird(); ctx.translate(-15,0); ctx.scale(0.9,0.9); drawBird(); ctx.globalAlpha = 1; }
ctx.rotate(bird.angle); drawBird(); ctx.restore();
ctx.fillStyle="white"; ctx.font="bold 24px system-ui"; ctx.textAlign="left"; ctx.shadowColor="black"; ctx.shadowBlur=4;
ctx.fillText(score,15,40); ctx.font="16px system-ui"; ctx.fillText("🪙 "+coins,15,68); ctx.fillText("★ "+best,15,90);
ctx.shadowBlur=0;
if(doubleCoinsActive){ ctx.fillStyle="#FFD700"; ctx.font="bold 14px system-ui"; ctx.fillText("2X COINS!",15,112); }
}
}

function drawBird(){
let s=skins[currentSkin];
if(s.effect === "aura"){ let auraSize = 20 + Math.sin(bird.animFrame*0.2)*5; ctx.shadowBlur = 20; ctx.shadowColor = s.secondary; ctx.strokeStyle = s.secondary; ctx.lineWidth = 3; ctx.globalAlpha = 0.4; ctx.beginPath(); ctx.arc(0,0,auraSize,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha = 1; ctx.shadowBlur = 0; }
if(shieldEquipped && hasShield){ ctx.strokeStyle = bird.invincible > 0? "cyan" : "#00ff88"; ctx.lineWidth = 3; ctx.globalAlpha = bird.invincible > 0? 0.4+Math.sin(frame*0.5)*0.2 : 0.7; ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha = 1; }
if(s.effect === "cape"){ let capeWave = Math.sin(bird.animFrame*0.3)*5; ctx.fillStyle = s.secondary; ctx.beginPath(); ctx.moveTo(-10,-5); ctx.lineTo(-25+capeWave,0); ctx.lineTo(-10,5); ctx.closePath(); ctx.fill(); }
let scaleX = 1, scaleY = 1;
if(currentSkin === "spiderman" && bird.jumpEffect > 0) { scaleY = 1.2; scaleX = 0.9; }
if(currentSkin === "ironman" && bird.jumpEffect > 0) { scaleX = 1.1; }
ctx.save(); ctx.scale(scaleX, scaleY);
ctx.fillStyle=s.color; ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.fill();
if(s.secondary && s.effect!== "cape"){ ctx.fillStyle=s.secondary; ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill(); }
ctx.restore();
ctx.fillStyle="white";
if(currentSkin === "batman"){ ctx.beginPath(); ctx.moveTo(5,-4); ctx.lineTo(9,-3); ctx.lineTo(5,-2); ctx.fill(); ctx.moveTo(5,4); ctx.lineTo(9,3); ctx.lineTo(5,2); ctx.fill(); }
else{ ctx.beginPath(); ctx.arc(5,-4,3.5,0,Math.PI*2); ctx.arc(5,4,3.5,0,Math.PI*2); ctx.fill(); ctx.fillStyle="black"; ctx.beginPath(); ctx.arc(6,-4,1.5,0,Math.PI*2); ctx.arc(6,4,1.5,0,Math.PI*2); ctx.fill(); }
if(currentSkin === "superman"){ let sSize = 9 + Math.sin(bird.animFrame*0.2)*1; ctx.fillStyle="#FFD700"; ctx.font=`bold ${sSize}px Arial`; ctx.textAlign="center"; ctx.fillText("S",0,3); }
if(currentSkin === "goku"){ ctx.fillStyle="#000"; ctx.font="bold 9px Arial"; ctx.textAlign="center"; ctx.fillText("亀",0,3); }
if(currentSkin === "ironman"){ let glow = 10 + Math.sin(bird.animFrame*0.3)*5; ctx.fillStyle="#FFFF00"; ctx.shadowBlur = glow; ctx.shadowColor = "#FFFF00"; ctx.beginPath(); ctx.arc(5,-4,2.2,0,Math.PI*2); ctx.arc(5,4,2.2,0,Math.PI*2); ctx.fill(); ctx.shadowBlur = 0; }
let flap=Math.sin(frame*0.8 + bird.jumpEffect*0.5); let wingColor = "rgba(255,255,255,0.95)";
if(currentSkin === "flash") wingColor = "rgba(255,255,100,0.95)";
if(currentSkin === "goku") wingColor = "rgba(135,206,255,0.9)";
ctx.fillStyle=wingColor; ctx.beginPath();
if(flap>0){ ctx.moveTo(-3,0); ctx.quadraticCurveTo(-28,-18,-12,-9); ctx.quadraticCurveTo(-6,-5,-3,0); }else{ ctx.moveTo(-3,0); ctx.quadraticCurveTo(-28,18,-12,9); ctx.quadraticCurveTo(-6,5,-3,0); }
ctx.fill();
if(currentSkin === "goku"){ ctx.strokeStyle = s.secondary; ctx.lineWidth = 2; ctx.globalAlpha = 0.5; ctx.stroke(); ctx.globalAlpha = 1; }
ctx.fillStyle="#ff9500"; ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(18,-3); ctx.lineTo(18,3); ctx.closePath(); ctx.fill();
}

function loop(){frame++;update();draw();requestAnimationFrame(loop);}loop();

function updateUI(){ coinsUI.innerText=coins; bestUI.innerText=best; }

loadGame(); checkUpdate(); updateUI(); renderShieldBtn(); renderDoubleCoinsBtn();
</script>
</body>
</html>
