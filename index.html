<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  overflow:hidden;
  width:100%;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
canvas{
  display:block;
  width:100%;
  height:auto;
  max-height:100vh;
  max-width:calc(100vh * 400 / 600);
}

#ui{
  position:absolute;
  width:100%;
  height:100vh;
  top:0;left:0;
  text-align:center;
  z-index:5;
  pointer-events:none;
}
#menu, #dead, button{
  pointer-events:auto;
  padding-top:20vh;
  color:white;
  text-shadow:2px 2px 4px #000;
}

.panel{
  position:absolute;
  width:100%;
  max-width:500px;
  height:100vh;
  top:0;left:50%;
  transform:translateX(-50%) scale(0.9);
  background:#111;color:white;
  display:none;
  overflow-y:auto;
  z-index:10;
  opacity:0;
  transition:0.2s;
  pointer-events:auto;
}
.panel.show{opacity:1;transform:translateX(-50%) scale(1);}

.tabs{display:flex;}
.tab{flex:1;padding:10px;background:#222;cursor:pointer;}
.tab.active{background:orange;}

.shopItem{background:#222;margin:10px;padding:10px;border-radius:10px;}
.preview{width:100px;height:50px;background:#000;margin:auto;}

button{
  padding:12px 24px;
  margin:5px;
  font-size:18px;
  cursor:pointer;
  border:none;
  border-radius:8px;
  background:#ff9500;
  color:white;
  font-weight:bold;
}
button:active{transform:scale(0.95);}
button:disabled{background:#555;cursor:not-allowed;}

/* AUTH OVERLAY */
#authOverlay{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:#050507;overflow:hidden}
#authOverlay .bg{position:fixed;inset:0;background:radial-gradient(800px circle at 20% 20%,#ff950033,transparent 40%),radial-gradient(600px circle at 80% 80%,#0066ff33,transparent 40%),linear-gradient(180deg,#0a0a0f,#050507)}
#authOverlay .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:f 12s infinite ease-in-out}
#authOverlay .o1{width:400px;height:400px;background:#ff9500;top:-100px;left:-100px}
#authOverlay .o2{width:350px;height:350px;background:#0066ff;bottom:-80px;right:-80px;animation-delay:-6s}
@keyframes f{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-20px)}}
#authOverlay .card{position:relative;z-index:2;width:92%;max-width:380px;background:rgba(255,255,255,.06);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:32px;box-shadow:0 25px 80px #0009}
#authOverlay .logo{font-size:32px;font-weight:800;background:linear-gradient(90deg,#ff9500,#ff5e00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;text-align:center}
#authOverlay .sub{opacity:.7;font-size:14px;margin-bottom:24px;text-align:center;color:#fff}
#authOverlay .tabs{display:flex;background:#0005;border-radius:14px;padding:4px;margin-bottom:22px}
#authOverlay .tab{flex:1;padding:10px;text-align:center;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;opacity:.7;transition:.2s;color:#fff}
#authOverlay .tab.active{background:#fff1;opacity:1}
#authOverlay .input{width:100%;padding:14px 16px;margin:8px 0;background:#0006;border:1px solid #fff1;border-radius:12px;color:#fff;font-size:15px;outline:none}
#authOverlay .input:focus{border-color:#ff9500;box-shadow:0 0 0 3px #ff950026}
#authOverlay .btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px;transition:.2s}
#authOverlay .btn-p{background:linear-gradient(90deg,#ff9500,#ff6a00);color:#fff}
#authOverlay .btn-p:hover{transform:translateY(-2px)}
#authOverlay .btn-g{background:#fff;color:#111;display:flex;align-items:center;justify-content:center;gap:10px}
#authOverlay .divider{display:flex;align-items:center;gap:10px;margin:18px 0;opacity:.5;font-size:12px;color:#fff}
#authOverlay .divider::before,#authOverlay .divider::after{content:"";flex:1;height:1px;background:#fff2}
#authOverlay .error{color:#ff5c5c;font-size:13px;min-height:18px;margin-top:8px;text-align:center}
#authOverlay .hidden{display:none}

</style>
</head>

<body>

<div id="authOverlay">
  <div class="bg"><div class="orb o1"></div><div class="orb o2"></div></div>
  <div class="card" id="authCard">
    <div class="logo">RRT FLAPPY</div>
    <div class="sub">Login oder Account erstellen</div>
    <div class="tabs">
      <div class="tab active" id="tLogin">Login</div>
      <div class="tab" id="tSignup">Registrieren</div>
    </div>
    <div id="fLogin">
      <input class="input" id="email1" type="email" placeholder="Email" autocomplete="email">
      <input class="input" id="pass1" type="password" placeholder="Passwort" autocomplete="current-password">
      <button class="btn btn-p" id="btnLogin">Einloggen</button>
    </div>
    <div id="fSignup" class="hidden">
      <input class="input" id="email2" type="email" placeholder="Email" autocomplete="email">
      <input class="input" id="pass2" type="password" placeholder="Passwort (min. 6)" autocomplete="new-password">

    <div class="divider"><span>ODER</span></div>

      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.9 0 7.4 1.3 10.1 3.9l7.6-7.6C37.3 2.1 31 0 24 0 14.6 0 6.6 5.4 2.7 13.3l8.9 6.9C13.5 14.1 18.3 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.4c-.5 2.7-2.1 5-4.4 6.5l7 5.4c4.1-3.8 6.5-9.4 6.5-16z"/><path fill="#FBBC05" d="M11.6 20.2c-.6-1.8-.9-3.7-.9-5.7s.3-3.9.9-5.7L2.7 1.9C1 5.3 0 9 0 13c0 4 1 7.7 2.7 11.1l8.9-3.9z"/><path fill="#34A853" d="M24 48c6.5 0 12-2.1 16-5.8l-7-5.4c-2 1.3-4.5 2.1-9 2.1-5.7 0-10.5-3.8-12.2-9l-8.9 6.9C6.6 42.6 14.6 48 24 48z"/></svg>
      Mit Google
    </button>
    <div class="error" id="authErr"></div>
  </div>
</div>


<div id="ui">
<div id="menu">
<h2>RRT-GAMES</h2>
<p id="userInfo" style="opacity:.7;font-size:12px;margin:4px 0 10px"></p>
<p>Coins: <span id="coinsUI">0</span></p>
<p>Best: <span id="bestUI">0</span></p>
<button onclick="startGame()">START</button>
<button onclick="openShop()">SHOP</button>
<button onclick="openUpdates()">UPDATES</button>
<button onclick="logout()" style="background:#333">LOGOUT</button>
</div>

<div id="dead" style="display:none;">
<h3>GAME OVER</h3>
<button onclick="startGame()">RETRY</button>
<button onclick="backMenu()">MENU</button>
</div>
</div>

<div class="panel" id="shop">
<div class="tabs">
<div class="tab active" onclick="tab('skins')">SKINS</div>
<div class="tab" onclick="tab('upgrades')">UPGRADES</div>
</div>
<div id="skinsTab"></div>
<div id="upgradesTab" style="display:none;">
  <div class='shopItem'>
    🛡️ SHIELD<br>
    Price: 50<br>
    Survive 1x crash<br>
    <button id="shieldBtn" onclick="buyShield()">BUY 50</button>
  </div>
  <div class='shopItem'>
    💰💰 DOUBLE COINS<br>
    Price: 200<br>
    2x Coins for 1 round<br>
    <button id="doubleCoinsBtn" onclick="buyDoubleCoins()">BUY 200</button>
  </div>
</div>
<button onclick="closeShop()">BACK</button>
</div>

<div class="panel" id="updates">
<h2>UPDATES</h2>
<div id="log"></div>
<button onclick="closeUpdates()">BACK</button>
</div>

<canvas id="game" width="400" height="600"></canvas>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { getDatabase, ref, set, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const cfg = {apiKey:"AIzaSyBBRFz8drGGRp_kpUR5HiIisR6WYdFnqI4",authDomain:"rrt-flappy-game.firebaseapp.com",databaseURL:"https://rrt-flappy-game-default-rtdb.europe-west1.firebasedatabase.app",projectId:"rrt-flappy-game",storageBucket:"rrt-flappy-game.firebasestorage.app",messagingSenderId:"376438140987",appId:"1:376438140987:web:15d964c26fa4a31ec4ec1e"};
const app = initializeApp(cfg);
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();

const authOverlay = document.getElementById('authOverlay');
const tLogin = document.getElementById('tLogin');
const tSignup = document.getElementById('tSignup');
const fLogin = document.getElementById('fLogin');
const fSignup = document.getElementById('fSignup');
const email1 = document.getElementById('email1');
const pass1 = document.getElementById('pass1');
const email2 = document.getElementById('email2');
const pass2 = document.getElementById('pass2');
const btnLogin = document.getElementById('btnLogin');
const btnSignup = document.getElementById('btnSignup');
const btnGoogle = document.getElementById('btnGoogle');
const authErr = document.getElementById('authErr');
const userInfo = document.getElementById('userInfo');

function showTab(which){
  const isLogin = which==='login';
  tLogin.classList.toggle('active', isLogin);
  tSignup.classList.toggle('active', !isLogin);
  fLogin.classList.toggle('hidden', !isLogin);
  fSignup.classList.toggle('hidden', isLogin);
  authErr.textContent='';
}
tLogin.onclick = ()=>showTab('login');
tSignup.onclick = ()=>showTab('signup');

btnLogin.onclick = async ()=>{
  authErr.textContent='';
  try{
    await signInWithEmailAndPassword(auth, email1.value.trim(), pass1.value);
  }catch(e){
    authErr.textContent = 'Falsche Email oder Passwort';
  }
};
btnSignup.onclick = async ()=>{
  authErr.textContent='';
  if(pass2.value.length<6){ authErr.textContent='Passwort zu kurz'; return; }
  try{
    await createUserWithEmailAndPassword(auth, email2.value.trim(), pass2.value);
  }catch(e){
    authErr.textContent = e.code==='auth/email-already-in-use' ? 'Email existiert bereits' : 'Fehler bei Registrierung';
  }
};
btnGoogle.onclick = async ()=>{
  authErr.textContent='';
  try{ await signInWithPopup(auth, provider); }catch(e){ authErr.textContent='Google Login abgebrochen'; }
};

window.logout = ()=> signOut(auth);

window.saveToFirebase = async (data)=>{
  if(!auth.currentUser) return;
  try{
    await set(ref(db, 'users/'+auth.currentUser.uid), {
      coins: data.coins,
      best: data.best,
      currentSkin: data.currentSkin,
      hasShield: data.hasShield,
      shieldEquipped: data.shieldEquipped,
      hasDoubleCoins: data.hasDoubleCoins,
      skins: data.skins,
      email: auth.currentUser.email,
      lastLogin: serverTimestamp()
    });
    console.log('✅ Cloud Save erfolgreich');
  }catch(e){ 
    console.error('Firebase save failed', e);
    alert('Cloud-Speicher fehlgeschlagen! Prüfe Firebase Rules.');
  }
};

onAuthStateChanged(auth, async (user)=>{
  const userInfo = document.getElementById('userInfo');
  window.currentUser = user;
  if(user){
    authOverlay.style.display='none';
    if(userInfo) userInfo.textContent = 'Eingeloggt als: ' + user.email;
    // Load from Firebase
    if(userInfo) userInfo.textContent = 'Lade Cloud-Daten...';
    try{
      const snap = await get(ref(db, 'users/'+user.uid));
      if(snap.exists()){
        window._fbData = snap.val();
        console.log('☁️ Cloud-Daten geladen', window._fbData);
        // Immer Cloud in local überschreiben
        localStorage.setItem('rrt_flappy_save', JSON.stringify(window._fbData));
      } else {
        // Erster Login: local -> cloud
        const local = localStorage.getItem('rrt_flappy_save');
        if(local){
          try{
            const data = JSON.parse(local);
            await set(ref(db, 'users/'+user.uid), {...data, email:user.email, lastLogin: serverTimestamp()});
            window._fbData = data;
            console.log('⬆️ Lokale Daten in Cloud hochgeladen');
          }catch(e){ console.error(e); }
        } else {
          window._fbData = null;
        }
      }
    }catch(e){ 
      console.error('Firebase load failed', e);
      alert('Fehler beim Laden aus Firebase! Prüfe Internet und Rules.');
    }
    // trigger game load
    if(typeof window._gameLoad === 'function') window._gameLoad();
    if(userInfo) userInfo.textContent = 'Eingeloggt als: ' + user.email;
  }else{
    authOverlay.style.display='flex';
    if(userInfo) userInfo.textContent = '';
    window._fbData = null;
    if(typeof window._gameLoad === 'function') window._gameLoad();
  }
});
</script>

<script>
const GAME_VERSION = "1.1.0";
const c=document.getElementById("game");
const ctx=c.getContext("2d");

const menu=document.getElementById("menu");
const dead=document.getElementById("dead");
const shop=document.getElementById("shop");
const updates=document.getElementById("updates");
const log=document.getElementById("log");
const coinsUI=document.getElementById("coinsUI");
const bestUI=document.getElementById("bestUI");
const skinsTab=document.getElementById("skinsTab");

let state="menu";
let bird,pipes=[];
let score=0,coins=0,best=0;
let frame=0;
let hasShield = false;
let shieldEquipped = false;
let hasDoubleCoins = false;
let doubleCoinsActive = false;

// SAVE SYSTEM
function saveGame(){
  const data = {
    coins,
    best,
    skins,
    currentSkin,
    hasShield,
    shieldEquipped,
    hasDoubleCoins
  };
  localStorage.setItem("rrt_flappy_save", JSON.stringify(data));
  if(window.currentUser && window.saveToFirebase){
    window.saveToFirebase(data);
  }
}

function loadGame(){
  const fbData = window._fbData;
  const localData = JSON.parse(localStorage.getItem("rrt_flappy_save"));
  // PRIORITÄT: Firebase immer zuerst!
  const data = fbData ?? localData;
  if(!data) return;

  coins = data.coins?? 0;
  best = data.best?? 0;
  currentSkin = data.currentSkin?? "default";
  hasShield = data.hasShield?? false;
  shieldEquipped = data.shieldEquipped?? false;
  hasDoubleCoins = data.hasDoubleCoins?? false;

  if(data.skins){
    for(let k in data.skins){
      if(skins[k]){
        skins[k].owned = data.skins[k].owned;
      }
    }
  }
  // Wenn wir aus der Cloud geladen haben, überschreibe local als Cache
  if(fbData){
    localStorage.setItem("rrt_flappy_save", JSON.stringify(fbData));
  }
}
window._gameLoad = ()=>{
  loadGame();
  updateUI();
  if(typeof renderShieldBtn==='function') renderShieldBtn();
  if(typeof renderDoubleCoinsBtn==='function') renderDoubleCoinsBtn();
  if(typeof renderShop==='function' && document.getElementById('shop').style.display!=='none') renderShop();
};

// UPDATE CHECK
async function checkUpdate(){
  try{
    const res = await fetch("update.json?t=" + Date.now());
    const data = await res.json();
    const lastSeen = localStorage.getItem("rrt_version_seen");

    if(data.version!== GAME_VERSION && data.version!== lastSeen){
      if(confirm(`🔥 UPDATE ${data.version} available!

${data.message}

Update now?`)){
        localStorage.setItem("rrt_version_seen", data.version);
        location.reload();
      }
    }
  }catch(e){}
}

setInterval(() => {
  if(state === "game" || state === "menu") checkUpdate();
}, 30000);

// SOUND
const AC=window.AudioContext||window.webkitAudioContext;
const audio=new AC();

function music(){
const notes=[440,660,550,440,330,440,550,660];
let i=0;

setInterval(()=>{
if(state!=="game")return;
if(audio.state==="suspended")audio.resume();

let o=audio.createOscillator();
let g=audio.createGain();

o.type="sine";
o.frequency.value=notes[i%notes.length];

g.gain.value=0.05;

o.connect(g);
g.connect(audio.destination);

o.start();
o.stop(audio.currentTime+0.12);

i++;
},150);
}
music();

function beep(f=440){
if(audio.state==="suspended")audio.resume();
let o=audio.createOscillator();
let g=audio.createGain();
o.connect(g);g.connect(audio.destination);
o.frequency.value=f;
g.gain.value=0.08;
o.start();
g.gain.exponentialRampToValueAtTime(0.0001,audio.currentTime+0.1);
o.stop(audio.currentTime+0.1);
}

// SKINS - HERO SKINS 20 COINS
let skins={
default:{price:0,owned:true,color:"yellow",name:"Classic"},
red:{price:10,owned:false,color:"red",name:"Red"},
blue:{price:10,owned:false,color:"blue",name:"Blue"},
green:{price:10,owned:false,color:"lime",name:"Green"},
spiderman:{price:20,owned:false,color:"#FF0000",secondary:"#0066FF",name:"Spider-Man",effect:"web"},
superman:{price:20,owned:false,color:"#0066FF",secondary:"#FF0000",name:"Superman",effect:"cape"},
batman:{price:20,owned:false,color:"#000000",secondary:"#111111",name:"Batman",effect:"smoke"},
ironman:{price:20,owned:false,color:"#FF0000",secondary:"#FFD700",name:"Iron Man",effect:"sparks"},
flash:{price:20,owned:false,color:"#FF0000",secondary:"#FFFF00",name:"Flash",effect:"lightning"},
goku:{price:20,owned:false,color:"#FF6600",secondary:"#0099FF",name:"Goku",effect:"aura"}
};
let currentSkin="default";

// PARTICLES
let particles=[];
function spawnParticle(x,y,type="normal",vx=0,vy=0){
let colors = {
  normal: "white",
  web: "#FFFFFF",
  cape: "#FF0000",
  smoke: "#333333",
  sparks: "#FFD700",
  lightning: "#FFFF00",
  aura: "#00BFFF",
  trail: "#FFFFFF"
};
particles.push({
  x,y,
  vx:vx || (Math.random()-0.5)*4,
  vy:vy || (Math.random()-0.5)*4,
  life:30,
  color: colors[type] || "white",
  size: type === "aura"? 8 : type === "lightning"? 2 : type === "trail"? 4 : 3,
  type: type
});
}

// GAME
function reset(){
  bird={x:100,y:300,vel:0,angle:0,invincible:0,animFrame:0,jumpEffect:0};
  pipes=[];
  score=0;
  doubleCoinsActive = hasDoubleCoins;
  if(hasDoubleCoins) {
    hasDoubleCoins = false;
    saveGame();
    renderDoubleCoinsBtn();
  }
}
function startGame(){reset();state="game";menu.style.display="none";dead.style.display="none";}
function backMenu(){state="menu";menu.style.display="block";dead.style.display="none";updateUI();saveGame();}

// SHOP
function openShop(){shop.style.display="block";shop.classList.add("show");renderShop();renderShieldBtn();renderDoubleCoinsBtn();}
function closeShop(){shop.style.display="none";shop.classList.remove("show");saveGame();}

async function openUpdates(){
  updates.style.display="block";
  requestAnimationFrame(()=>{
    updates.classList.add("show");
  });

  log.innerHTML = "Loading...";

  try {
    const res = await fetch("update.json?t=" + Date.now());
    if(!res.ok) throw new Error("HTTP " + res.status);

    const data = await res.json();

    if(data.patchNotes){
      log.innerHTML = `<b>Version ${data.version}</b><br><br>` + data.patchNotes.map(t => `• ${t}`).join("<br>");
      return;
    }

    log.innerHTML = "No updates found";
  } catch (err) {
    log.innerHTML = "❌ Failed to load updates";
    console.error(err);
  }
}

function closeUpdates(){
  updates.classList.remove("show");
  setTimeout(()=>{
    updates.style.display="none";
  }, 200);
}

function tab(t){
skinsTab.style.display=t==="skins"?"block":"none";
upgradesTab.style.display=t==="upgrades"?"block":"none";
document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
event.target.classList.add('active');
}

function renderShop(){
let html="";
for(let k in skins){
let s=skins[k];
let btnTxt = "BUY";
let btnDisabled = "";

if(s.owned){
  if(currentSkin === k){
    btnTxt = "EQUIPPED";
    btnDisabled = "disabled";
  } else {
    btnTxt = "EQUIP";
  }
}

html+=`<div class='shopItem'>${s.name}<br>Price:${s.price}<br><canvas id='p_${k}' width='100' height='50' class='preview'></canvas><br><button onclick="${s.owned?`equip('${k}')`:`buySkin('${k}')`}" ${btnDisabled}>${btnTxt}</button></div>`;
}
skinsTab.innerHTML=html;
for(let k in skins) drawPreview(k);
}

function buySkin(k){
let s=skins[k];
if(coins>=s.price){
coins-=s.price;
s.owned=true;
currentSkin=k;
updateUI();
renderShop();
saveGame();
beep(800);
}
}
function equip(k){currentSkin=k;renderShop();saveGame();beep(600);}

// SHIELD SYSTEM
function buyShield(){
  if(coins >= 50 &&!hasShield){
    coins -= 50;
    hasShield = true;
    shieldEquipped = true;
    updateUI();
    renderShieldBtn();
    saveGame();
    beep(800);
  }
}

function renderShieldBtn(){
  const btn = document.getElementById("shieldBtn");
  if(!btn) return;

  if(!hasShield){
    btn.innerText = "BUY 50";
    btn.disabled = false;
    btn.onclick = buyShield;
  } else if(shieldEquipped){
    btn.innerText = "EQUIPPED";
    btn.disabled = true;
  } else {
    btn.innerText = "EQUIP";
    btn.disabled = false;
    btn.onclick = () => {
      shieldEquipped = true;
      renderShieldBtn();
      saveGame();
      beep(600);
    }
  }
}

// DOUBLE COINS SYSTEM
function buyDoubleCoins(){
  if(coins >= 200 &&!hasDoubleCoins){
    coins -= 200;
    hasDoubleCoins = true;
    updateUI();
    renderDoubleCoinsBtn();
    saveGame();
    beep(800);
  }
}

function renderDoubleCoinsBtn(){
  const btn = document.getElementById("doubleCoinsBtn");
  if(!btn) return;

  if(!hasDoubleCoins){
    btn.innerText = "BUY 200";
    btn.disabled = false;
    btn.onclick = buyDoubleCoins;
  } else {
    btn.innerText = "READY FOR NEXT ROUND";
    btn.disabled = true;
  }
}

// PREVIEW
function drawPreview(k){
let canvas=document.getElementById("p_"+k);
if(!canvas)return;
let ctx=canvas.getContext("2d");
let t=0;

function loop(){
ctx.clearRect(0,0,100,50);
t+=0.1;
let s=skins[k];

// Animation im Preview
let scale = 1;
let rot = 0;
if(k === "flash") rot = Math.sin(t*10)*0.3;
if(k === "goku") scale = 1 + Math.sin(t*5)*0.1;
if(k === "ironman") scale = 1 + Math.sin(t*8)*0.05;

ctx.save();
ctx.translate(50,25);
ctx.scale(scale,scale);
ctx.rotate(rot);

ctx.fillStyle=s.color;
ctx.beginPath();
ctx.arc(0,0,10,0,Math.PI*2);
ctx.fill();

if(s.secondary){
  ctx.fillStyle=s.secondary;
  ctx.beginPath();
  ctx.arc(0,0,6,0,Math.PI*2);
  ctx.fill();
}

// Eyes
ctx.fillStyle="white";
if(k === "batman"){
  ctx.beginPath();
  ctx.moveTo(3,-3); ctx.lineTo(6,-2); ctx.lineTo(3,-1); ctx.fill();
  ctx.moveTo(3,3); ctx.lineTo(6,2); ctx.lineTo(3,1); ctx.fill();
} else {
  ctx.beginPath();
  ctx.arc(3,-3,3,0,Math.PI*2);
  ctx.arc(3,3,3,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="black";
  ctx.beginPath();
  ctx.arc(4,-3,1.3,0,Math.PI*2);
  ctx.arc(4,3,1.3,0,Math.PI*2);
  ctx.fill();
}

if(k === "superman"){
  ctx.fillStyle="#FF0000";
  ctx.font="bold 8px Arial";
  ctx.textAlign="center";
  ctx.fillText("S",0,3);
}
if(k === "goku"){
  ctx.fillStyle="#000";
  ctx.font="bold 8px Arial";
  ctx.textAlign="center";
  ctx.fillText("亀",0,3);
}
if(k === "ironman"){
  ctx.fillStyle="#FFFF00";
  ctx.shadowBlur = 10;
  ctx.shadowColor = "#FFFF00";
  ctx.beginPath();
  ctx.arc(3,-3,2,0,Math.PI*2);
  ctx.arc(3,3,2,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

// FLÜGEL
let flap=Math.sin(t*8);
ctx.fillStyle="rgba(255,255,255,0.9)";
ctx.beginPath();
if(flap>0){
ctx.moveTo(-10,0);
ctx.quadraticCurveTo(-35,-15,-20,-8);
ctx.quadraticCurveTo(-12,-5,-10,0);
}else{
ctx.moveTo(-10,0);
ctx.quadraticCurveTo(-35,15,-20,8);
ctx.quadraticCurveTo(-12,5,-10,0);
}
ctx.fill();

ctx.restore();

requestAnimationFrame(loop);
}
loop();
}

// INPUT
document.addEventListener("keydown",e=>{if(e.code==="Space")jump();});
c.addEventListener("touchstart",e=>{e.preventDefault();jump();});
c.addEventListener("click",()=>jump());
function jump(){
  if(state!=="game")return;
  bird.vel=-6;
  bird.jumpEffect = 10; // Für Animationen
  beep(520);

  let skin = skins[currentSkin];
  let effect = skin.effect || "normal";

  // Spawn special particles on jump
  if(effect === "web") {
    for(let i=0;i<8;i++) spawnParticle(bird.x,bird.y,"web",-Math.random()*3-2,(Math.random()-0.5)*4);
  } else if(effect === "sparks") {
    for(let i=0;i<12;i++) spawnParticle(bird.x,bird.y,"sparks",(Math.random()-0.5)*5,(Math.random()-0.5)*5);
  } else if(effect === "lightning") {
    for(let i=0;i<10;i++) spawnParticle(bird.x,bird.y,"lightning",-Math.random()*6-3,0);
  } else if(effect === "smoke") {
    for(let i=0;i<6;i++) spawnParticle(bird.x,bird.y,"smoke",-Math.random()*2-1,(Math.random()-0.5)*2);
  } else {
    spawnParticle(bird.x,bird.y);
  }
}

// DIFFICULTY
let pipeGap=150;
let speed=3;
function difficulty(){pipeGap=Math.max(90,150-score*2);speed=3+score*0.05;}

// UPDATE
function update(){
if(state!=="game")return;

difficulty();

bird.vel+=0.35;
bird.y+=bird.vel;
bird.angle=bird.vel*0.08;
bird.animFrame++;
if(bird.jumpEffect > 0) bird.jumpEffect--;

if(bird.invincible > 0) bird.invincible--;

if(frame%90===0){
pipes.push({x:400,top:100+Math.random()*250,passed:false});
}

for(let p of pipes){
p.x-=speed;

if(!p.passed && p.x<bird.x){
p.passed=true;
score++;
coins += doubleCoinsActive? 2 : 1;
beep(700);
}

if(bird.invincible <= 0){
  if(bird.x<p.x+70&&bird.x+20>p.x&&(bird.y<p.top||bird.y>p.top+pipeGap))die();
}
}

// Continuous effects
let skin = skins[currentSkin];
if(skin.effect === "aura") {
  for(let i=0;i<3;i++) spawnParticle(bird.x+(Math.random()-0.5)*20,bird.y+(Math.random()-0.5)*20,"aura");
}
if(skin.effect === "cape") spawnParticle(bird.x-15,bird.y,"cape",-2,0);
if(skin.effect === "smoke") spawnParticle(bird.x-10,bird.y,"smoke",-1,0);
// Flash Speed Trail
if(skin.effect === "lightning") {
  spawnParticle(bird.x-20,bird.y,"trail",0,0);
}

if(bird.y>520||bird.y<0)die();
}

function die(){
  if(shieldEquipped && hasShield){
    hasShield = false;
    shieldEquipped = false;
    bird.y = 250;
    bird.vel = -4;
    bird.invincible = 60;
    beep(900);
    saveGame();
    renderShieldBtn();
    return;
  }

  state="dead";
  dead.style.display="block";
  if(score>best)best=score;
  beep(140);
  updateUI();
  saveGame();
}

// DRAW
function draw(){
ctx.clearRect(0,0,400,600);

ctx.fillStyle="#70c5ce";
ctx.fillRect(0,0,400,600);

ctx.fillStyle="#d2b48c";
ctx.fillRect(0,520,400,80);

particles=particles.filter(p=>p.life>0);
for(let p of particles){
p.x+=p.vx;
p.y+=p.vy;
p.life--;
ctx.fillStyle=p.color;
ctx.globalAlpha = p.life/30;
ctx.beginPath();
ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
ctx.fill();
ctx.globalAlpha = 1;
}

if(state==="game"||state==="dead"){
ctx.save();
ctx.translate(bird.x,bird.y);

// Flash Afterimage
if(currentSkin === "flash" && bird.jumpEffect > 5){
  ctx.globalAlpha = 0.3;
  ctx.translate(-15,0);
  ctx.scale(0.9,0.9);
  drawBird();
  ctx.translate(-15,0);
  ctx.scale(0.9,0.9);
  drawBird();
  ctx.globalAlpha = 1;
}

ctx.rotate(bird.angle);
drawBird();
ctx.restore();

for(let p of pipes){
ctx.fillStyle="green";
ctx.fillRect(p.x,0,70,p.top);
ctx.fillRect(p.x,p.top+pipeGap,70,600);
}

ctx.fillStyle="black";
ctx.font="20px Arial";
ctx.textAlign="left";
ctx.fillText("Score:"+score,10,30);
ctx.fillText("Coins:"+coins,10,55);
ctx.fillText("Best:"+best,10,80);

if(doubleCoinsActive){
  ctx.fillStyle="#FFD700";
  ctx.font="bold 16px Arial";
  ctx.fillText("2X COINS!",10,105);
}
}
}

function drawBird(){
let s=skins[currentSkin];

// Goku Aura
if(s.effect === "aura"){
  let auraSize = 20 + Math.sin(bird.animFrame*0.2)*5;
  ctx.shadowBlur = 20;
  ctx.shadowColor = s.secondary;
  ctx.strokeStyle = s.secondary;
  ctx.lineWidth = 3;
  ctx.globalAlpha = 0.4;
  ctx.beginPath();
  ctx.arc(0,0,auraSize,0,Math.PI*2);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

// Shield
if(shieldEquipped && hasShield){
  ctx.strokeStyle = bird.invincible > 0? "cyan" : "lime";
  ctx.lineWidth = 3;
  ctx.globalAlpha = bird.invincible > 0? 0.3 : 0.6;
  ctx.beginPath();
  ctx.arc(0,0,18,0,Math.PI*2);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// Cape for Superman - Animiert
if(s.effect === "cape"){
  let capeWave = Math.sin(bird.animFrame*0.3)*5;
  ctx.fillStyle = s.secondary;
  ctx.beginPath();
  ctx.moveTo(-10,-5);
  ctx.lineTo(-25+capeWave,0);
  ctx.lineTo(-10,5);
  ctx.closePath();
  ctx.fill();
}

// Main body - Spider-Man wackelt beim Jump
let scaleX = 1, scaleY = 1;
if(currentSkin === "spiderman" && bird.jumpEffect > 0) {
  scaleY = 1.2;
  scaleX = 0.9;
}
if(currentSkin === "ironman" && bird.jumpEffect > 0) {
  scaleX = 1.1;
}

ctx.save();
ctx.scale(scaleX, scaleY);

ctx.fillStyle=s.color;
ctx.beginPath();
ctx.arc(0,0,10,0,Math.PI*2);
ctx.fill();

// Secondary color overlay
if(s.secondary && s.effect!== "cape"){
  ctx.fillStyle=s.secondary;
  ctx.beginPath();
  ctx.arc(0,0,6,0,Math.PI*2);
  ctx.fill();
}

ctx.restore();

// Eyes - Batman = spitze Augen
ctx.fillStyle="white";
if(currentSkin === "batman"){
  ctx.beginPath();
  ctx.moveTo(4,-4); ctx.lineTo(8,-3); ctx.lineTo(4,-2); ctx.fill();
  ctx.moveTo(4,4); ctx.lineTo(8,3); ctx.lineTo(4,2); ctx.fill();
} else {
  ctx.beginPath();
  ctx.arc(4,-3,3,0,Math.PI*2);
  ctx.arc(4,3,3,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="black";
  ctx.beginPath();
  ctx.arc(5,-3,1.3,0,Math.PI*2);
  ctx.arc(5,3,1.3,0,Math.PI*2);
  ctx.fill();
}

// Logos - Superman S pulsiert
if(currentSkin === "superman"){
  let sSize = 8 + Math.sin(bird.animFrame*0.2)*1;
  ctx.fillStyle="#FF0000";
  ctx.font=`bold ${sSize}px Arial`;
  ctx.textAlign="center";
  ctx.fillText("S",0,3);
}
if(currentSkin === "goku"){
  ctx.fillStyle="#000";
  ctx.font="bold 8px Arial";
  ctx.textAlign="center";
  ctx.fillText("亀",0,3);
}
if(currentSkin === "ironman"){
  let glow = 10 + Math.sin(bird.animFrame*0.3)*5;
  ctx.fillStyle="#FFFF00";
  ctx.shadowBlur = glow;
  ctx.shadowColor = "#FFFF00";
  ctx.beginPath();
  ctx.arc(4,-3,2,0,Math.PI*2);
  ctx.arc(4,3,2,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

// FLÜGEL - KRASSER ANIMIERT
let flap=Math.sin(frame*0.8 + bird.jumpEffect*0.5);
let wingColor = "rgba(255,255,255,0.9)";

// Flash = gelbe Flügel
if(currentSkin === "flash") wingColor = "rgba(255,255,0,0.9)";
// Goku = blaue Energie-Flügel
if(currentSkin === "goku") wingColor = "rgba(0,191,255,0.7)";

ctx.fillStyle=wingColor;
ctx.beginPath();
if(flap>0){
ctx.moveTo(-2,0);
ctx.quadraticCurveTo(-25,-15,-10,-8);
ctx.quadraticCurveTo(-5,-5,-2,0);
}else{
ctx.moveTo(-2,0);
ctx.quadraticCurveTo(-25,15,-10,8);
ctx.quadraticCurveTo(-5,5,-2,0);
}
ctx.fill();

// Extra Flügel für Goku
if(currentSkin === "goku"){
  ctx.strokeStyle = s.secondary;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.5;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// Glow for Iron Man
if(currentSkin === "ironman"){
  ctx.shadowBlur = 15;
  ctx.shadowColor = s.secondary;
}
}

function loop(){frame++;update();draw();requestAnimationFrame(loop);}loop();

function updateUI(){
coinsUI.innerText=coins;
bestUI.innerText=best;
}

// INIT
loadGame();
checkUpdate();
updateUI();
renderShieldBtn();
renderDoubleCoinsBtn();
</script>
</body>
</html>
